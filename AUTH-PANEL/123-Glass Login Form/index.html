<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Login Form | CodeByGaurav</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glass-card">
        <h2>Login</h2>
        <form>

            <div class="field-group">
                <input type="email" id="emailInput" required autocomplete="off">
                <label for="emailInput">Enter your Email</label>
            </div>

            <div class="field-group">
                <input type="password" id="passInput" required autocomplete="off">
                <label for="passInput">Enter your Password</label>
            </div>

            <div class="options-row">
                <label class="remember-wrap">
                    <input type="checkbox" checked>
                    <span>Remember me</span>
                </label>
                <a href="#" class="forgot-link">Forgot password</a>
            </div>

            <button type="submit" class="login-btn">Log In</button>

            <div class="register-text">
                Don't have an account? <a href="#">Register</a>
            </div>
        </form>
    </div>
</body>
</html>
