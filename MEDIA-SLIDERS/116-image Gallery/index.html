<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery | CodeByGaurav</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .wrapper{
            width: 700px;
            margin: 50px auto;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px 2px rgba(0, 0, 0, 0.2);
        }
        .largeImg{
            width: 100%;
            height: 300px;
            margin-bottom: 20px;
        }

        .largeImg img{
            width: 100%;
            height: 100%;
            border-radius: 4px;
        }

        .smallImages{
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
        }
        .smallImages img{
            width: 100%;
            height: 100%;
            border-radius: 4px;
            cursor: pointer;
        }

    </style>
</head>
<body>
    <div class="wrapper">
        <div class="largeImg">
            <img src="./images/1.jpg" alt="01 Image">
        </div>
        <div class="smallImages">
            <img onclick="displayImg(this)" src="./images/2.jpg" alt="02 Image">
            <img onclick="displayImg(this)" src="./images/3.jpg" alt="03 Image">
            <img onclick="displayImg(this)" src="./images/4.jpg" alt="04 Image">
            <img onclick="displayImg(this)" src="./images/5.jpg" alt="05 Image">
            <img onclick="displayImg(this)" src="./images/6.jpg" alt="06 Image">
        </div>
    </div>
</body>
<script>
    const largeImg = document.querySelector(".largeImg img");

    function displayImg(img){
        largeImg.src = img.src;
    }

</script>
</html>
